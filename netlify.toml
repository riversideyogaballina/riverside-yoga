[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/reviews"
  to = "/.netlify/functions/reviews"
  status = 200

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Foundations workshops discontinued — send old links home
[[redirects]]
  from = "/workshop"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/workshop.html"
  to = "/"
  status = 301
  force = true
